version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /apps/news-digest
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/spending-bot
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
