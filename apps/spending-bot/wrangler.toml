name = "spending-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The Mini App page (web/), built into dist/web/ by scripts/build-web.mjs before dev and deploy.
[build]
command = "node scripts/build-web.mjs"
watch_dir = ["web", "src"] # the page also bundles src/ai/categories.ts and src/report/format.ts

# Served at /app/. The Worker runs first for every request: POSTs are the webhook, and the
# assets are only reached through handleWebRequest (src/web/server.ts).
[assets]
directory = "./dist/web"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[vars]
# The group's chat id (negative number). Leave empty on first deploy, add the bot
# to the group, read the id from `wrangler tail`, then set it and deploy again.
ALLOWED_CHAT_ID = "-1001551080059"
# Bot username without "@", used to match `/cmd@BotName`.
BOT_USERNAME = "nth1bot"
# Workers AI model for expense categories and the monthly commentary. Empty = no LLM;
# the bot then works exactly as before, minus those two features.
LLM_MODEL = "@cf/aisingapore/gemma-sea-lion-v4-27b-it"
# Google Sheet that gets one tab per month (the id in its URL). Empty = no Sheets sync.
# Needs the GOOGLE_SERVICE_ACCOUNT_KEY secret; see "Google Sheets sync" in README.md.
GOOGLE_SHEET_ID = "1R_qQAc6deV-0w3Ka7qhtZlA9Jt-MNjKMzYq3aV59eTQ"
# Telegram user id the bot tells when the Sheet stops updating, and when it recovers.
# They must have pressed Start in a private chat with the bot. Empty = failures are only logged.
ADMIN_USER_ID = "1065060927"

# Workers AI. Free plan: a daily allowance, after which calls fail (no charge) and the
# bot falls back: categories are retried by the next daily cron, commentary is skipped.
# `remote = true` states what wrangler dev does anyway (Workers AI has no local simulator)
# and silences its warning. Tests stub the binding instead (vitest.config.ts).
[ai]
binding = "AI"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "spending-bot-db"
database_id = "a42ba259-a356-4391-96ed-9ca9da68cc61"
migrations_dir = "migrations"

[triggers]
# Cron runs in UTC; ICT = UTC+7.
# 21:00 ICT daily recap, 09:00 ICT on the 1st monthly summary.
crons = ["0 14 * * *", "0 2 1 * *"]
